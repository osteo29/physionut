    <style>
      :root {
        color-scheme: light;
        --boot-bg: #0f0d0a;
        --boot-card: rgba(24, 21, 17, 0.92);
        --boot-deep: #0f0d0a;
        --boot-mid: #c49a42;
        --boot-soft: #f3d78a;
        --boot-text: #f7f0e4;
        --boot-muted: #d8ccb4;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(196, 154, 66, 0.18), transparent 30%),
          linear-gradient(180deg, #181511 0%, var(--boot-bg) 100%);
      }

      body {
        font-family: "Aptos", "Trebuchet MS", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 18%, rgba(196, 154, 66, 0.22), transparent 24%),
          linear-gradient(180deg, #181511 0%, var(--boot-bg) 100%);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }

      .boot-mark {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 112px;
        height: 112px;
        border-radius: 34px;
        padding: 10px;
        background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(196,154,66,0.12));
        border: 1px solid rgba(196, 154, 66, 0.24);
        box-shadow:
          0 26px 52px rgba(0, 0, 0, 0.32),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .boot-title {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--boot-text);
        text-transform: uppercase;
      }

      .boot-title span {
        color: var(--boot-mid);
      }

      .boot-subtitle {
        max-width: 280px;
        font-size: 13px;
        line-height: 1.7;
        color: var(--boot-muted);
      }

      .boot-loader {
        width: 92px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(196, 154, 66, 0.14);
      }

      .boot-loader::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--boot-soft), var(--boot-mid));
        animation: boot-slide 1.2s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(240%); }
      }
    </style>
